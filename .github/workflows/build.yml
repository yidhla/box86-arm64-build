name: Build Box64 + Get Wine Libs v3
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  get-wine:
    runs-on: ubuntu-latest
    steps:
      - name: Download wine i386
        run: |
          sudo dpkg --add-architecture i386
          sudo apt-get update -qq
          mkdir -p /tmp/debs
          cd /tmp/debs
          apt-get download wine32:i386 libwine:i386 2>&1

      - name: List ALL files
        run: |
          mkdir -p /tmp/wc
          for deb in /tmp/debs/*.deb; do
            echo "=== $deb ==="
            dpkg-deb -x "$deb" /tmp/wc/ 2>/dev/null
          done
          echo "=== ALL FILES ==="
          find /tmp/wc -type f | sort

      - name: Extract with correct paths
        run: |
          mkdir -p /tmp/wine-out/lib/wine
          # 查找实际路径
          NTDLL=$(find /tmp/wc -name 'ntdll.so' -type f | head -1)
          WINE=$(find /tmp/wc -name 'wine' -type f | head -3 | tail -1)
          PRELOADER=$(find /tmp/wc -name 'wine-preloader' -type f | head -1)
          WS=$(find /tmp/wc -name 'wineserver' -type f | head -1)
          LIBWINE=$(find /tmp/wc -name 'libwine.so.1' -type f | head -1)
          LIBWINE0=$(find /tmp/wc -name 'libwine.so.1.0' -type f | head -1)
          echo "ntdll: $NTDLL"
          echo "wine: $WINE"
          echo "preloader: $PRELOADER"
          echo "wineserver: $WS"
          echo "libwine.so.1: $LIBWINE"
          echo "libwine.so.1.0: $LIBWINE0"
          # 复制
          [ -n "$NTDLL" ] && cp -v "$NTDLL" /tmp/wine-out/lib/wine/
          [ -n "$WINE" ] && cp -v "$WINE" /tmp/wine-out/
          [ -n "$PRELOADER" ] && cp -v "$PRELOADER" /tmp/wine-out/
          [ -n "$WS" ] && cp -v "$WS" /tmp/wine-out/
          [ -n "$LIBWINE" ] && cp -v "$LIBWINE" /tmp/wine-out/lib/
          [ -n "$LIBWINE0" ] && cp -v "$LIBWINE0" /tmp/wine-out/lib/
          echo "=== EXTRACTED ==="
          find /tmp/wine-out -type f -exec ls -lh {} \;

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: wine-core-libs
          path: /tmp/wine-out/

  build-box64:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
        with:
          repository: ptitSeb/box64
          path: box64
      - name: Build box64
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq cmake gcc
          mkdir -p box64/build && cd box64/build
          cmake .. -DARM64=1
          make -j$(nproc)
      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: box64-arm64
          path: box64/build/box64
