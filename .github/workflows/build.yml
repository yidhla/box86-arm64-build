name: Build Box64 + Get Wine20 Libs
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  get-wine20:
    runs-on: ubuntu-latest
    steps:
      - name: Extract wine from Ubuntu 20.04 Docker
        run: |
          cat > /tmp/Dockerfile << 'EOF'
FROM ubuntu:20.04
RUN dpkg --add-architecture i386 && apt-get update -qq && apt-get install -y -qq wine32:i386 libwine:i386 2>&1 | tail -3
RUN mkdir -p /out/lib/wine &&     cp -v /usr/lib/i386-linux-gnu/wine/i386-unix/ntdll.so /out/lib/wine/ &&     cp -v /usr/lib/i386-linux-gnu/libwine.so.1 /out/lib/ 2>/dev/null;     cp -v /usr/lib/i386-linux-gnu/libwine.so.1.0 /out/lib/ 2>/dev/null;     cp -v /usr/bin/wine /out/ 2>/dev/null;     cp -v /usr/bin/wine-preloader /out/ 2>/dev/null;     find /usr/lib -name 'wineserver' -exec cp -v {} /out/ \; ;     echo "=== DONE ==="
EOF
          docker build -t wine20-extract /tmp/ --no-cache 2>&1 | tail -5
          docker create --name wine20 wine20-extract
          mkdir -p /tmp/wine-out
          docker cp wine20:/out/. /tmp/wine-out/
          docker rm wine20
          echo "=== EXTRACTED ==="
          find /tmp/wine-out -type f -exec ls -lh {} \;

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: wine20-libs
          path: /tmp/wine-out/

  build-box64:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
        with:
          repository: ptitSeb/box64
          path: box64
      - name: Build box64
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq cmake gcc
          mkdir -p box64/build && cd box64/build
          cmake .. -DARM64=1 -DCMAKE_C_FLAGS="-static-libgcc -static-libstdc++"
          make -j$(nproc)
      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: box64-arm64
          path: box64/build/box64
