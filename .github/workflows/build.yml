name: Build Box64 (native ARM64)
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04-arm
    steps:
      - run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq cmake gcc git make
          git clone --depth=1 https://github.com/ptitSeb/box64.git /tmp/box64
          cd /tmp/box64 && mkdir -p build && cd build
          cmake .. -DARM64=1 -DCMAKE_BUILD_TYPE=Release
          make -j$(nproc)
          file box64
          ls -lh box64

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: box64-arm64-native
          path: /tmp/box64/build/box64
