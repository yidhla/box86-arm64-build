name: Build Box86 ARM
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - name: Install deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq cmake gcc-arm-linux-gnueabihf
      - name: Build
        run: |
          mkdir -p build && cd build
          cmake .. -DCMAKE_C_COMPILER=arm-linux-gnueabihf-gcc -DARM_DYNAREC=1
          make -j$(nproc)
      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: box86-arm32
          path: build/box86
