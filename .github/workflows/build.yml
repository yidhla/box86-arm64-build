name: Get Box64 + Standard Wine
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  get-wine:
    runs-on: ubuntu-22.04
    steps:
      - name: Download wine from Ubuntu 20.04 archive
        run: |
          # Direct download from archive.ubuntu.com pool
          mkdir -p /tmp/wine-pkgs /tmp/wine-out
          cd /tmp/wine-pkgs
          wget -q http://archive.ubuntu.com/ubuntu/pool/universe/w/wine/libwine_5.0-3ubuntu1_i386.deb
          wget -q http://archive.ubuntu.com/ubuntu/pool/universe/w/wine/wine32_5.0-3ubuntu1_i386.deb
          
          # Extract
          for deb in *.deb; do
            dpkg-deb -x "$deb" /tmp/wine-out/ 2>/dev/null
          done
          
          # Find ntdll.so and related files
          find /tmp/wine-out -name '*.so' -exec ls -lh {} \; 2>/dev/null
          find /tmp/wine-out -name 'wine' -type f -exec ls -lh {} \; 2>/dev/null
          find /tmp/wine-out -name 'wineserver' -exec ls -lh {} \; 2>/dev/null

      - name: Check GLIBC requirements
        run: |
          for f in $(find /tmp/wine-out -name 'ntdll.so'); do
            echo "=== $f ==="
            objdump -p "$f" 2>/dev/null | grep NEEDED || true
            strings "$f" | grep -i 'glibc' | head -3
          done

      - name: Upload wine libs
        uses: actions/upload-artifact@v4
        with:
          name: wine-standard-libs
          path: /tmp/wine-out/

  build-box64:
    runs-on: ubuntu-22.04
    steps:
      - name: Cross-compile box64 for ARM64
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq gcc-aarch64-linux-gnu cmake make git
          git clone --depth=1 https://github.com/ptitSeb/box64.git /tmp/box64-src
          mkdir -p /tmp/box64-src/build && cd /tmp/box64-src/build
          cmake .. -DARM64=1 -DCMAKE_C_COMPILER=aarch64-linux-gnu-gcc -DCMAKE_BUILD_TYPE=Release
          make -j$(nproc)
          echo "=== BUILD RESULT ==="
          file box64
          ls -lh box64

      - name: Check GLIBC requirements
        run: |
          objdump -p /tmp/box64-src/build/box64 2>/dev/null | grep NEEDED
          strings /tmp/box64-src/build/box64 | grep 'GLIBC' | sort -u

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: box64-arm64-v2
          path: /tmp/box64-src/build/box64
